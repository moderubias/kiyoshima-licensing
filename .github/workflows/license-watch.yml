name: License watch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Search public GitHub code
        env:
          KIYOSHIMA_MONITOR_TOKEN: ${{ secrets.KIYOSHIMA_MONITOR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/klicense.py monitor --output kiyoshima-watch.json --allow-no-token
      - name: Publish report summary
        if: always()
        run: |
          if [ -f kiyoshima-watch.json ]; then
            python tools/klicense.py summarize-watch kiyoshima-watch.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: kiyoshima-license-watch
          path: kiyoshima-watch.json
          if-no-files-found: ignore
          retention-days: 30
